<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entregas Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#EEF0F2;
  --surface:#FFFFFF;
  --ink:#1A2230;
  --ink-muted:#5C6B7A;
  --accent:#B8863E;
  --accent-deep:#2F5233;
  --header-bg:#DCEEDC;
  --header-ink:#1F3D27;
  --line:#D7DCE2;
  --agendada:#3E6FA8;
  --realizada:#4C7A5E;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
header.topbar{background:var(--header-bg);color:var(--header-ink);padding:18px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
header.topbar .brand{font-weight:700;font-size:18px;letter-spacing:.01em;display:flex;align-items:center;gap:10px;}
header.topbar .brand img{height:34px;width:auto;display:block;}
header.topbar nav a{color:var(--header-ink);text-decoration:none;font-size:13px;border:1px solid rgba(31,61,39,.3);padding:6px 12px;border-radius:6px;cursor:pointer;}
header.topbar nav a:hover{background:rgba(31,61,39,.08);}
main{max-width:620px;margin:0 auto;padding:28px 18px 60px;}
main.wide{max-width:1080px;}
.ficha{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:26px 24px;margin-bottom:18px;}
.ficha .corner{position:absolute;width:14px;height:14px;border-color:var(--accent-deep);}
.ficha .corner.tl{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid;}
.ficha .corner.tr{top:-1px;right:-1px;border-top:2px solid;border-right:2px solid;}
.ficha .corner.bl{bottom:-1px;left:-1px;border-bottom:2px solid;border-left:2px solid;}
.ficha .corner.br{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid;}
.stamp{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border:2px solid currentColor;border-radius:4px;font-weight:600;}
.stamp.agendada{color:var(--agendada);}
.stamp.entregada{color:var(--realizada);}
.stamp.sinagendar{color:var(--ink-muted);}
h1,h2,h3{margin:0 0 6px;}
h2{font-size:20px;font-weight:600;}
h3{font-size:14px;color:var(--ink-muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
label{font-size:12px;color:var(--ink-muted);display:block;margin-bottom:4px;font-weight:500;}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-family:var(--font-body);font-size:14px;background:#fff;color:var(--ink);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
.field{margin-bottom:14px;}
.row{display:flex;gap:12px;flex-wrap:wrap;}
.row > .field{flex:1;min-width:140px;}
button{font-family:var(--font-body);font-weight:600;font-size:14px;padding:10px 18px;border-radius:6px;border:none;background:var(--accent-deep);color:#fff;cursor:pointer;}
button:hover{background:#244129;}
button.secondary{background:transparent;color:var(--accent-deep);border:1px solid var(--line);}
button.secondary:hover{border-color:var(--accent-deep);}
button.danger{background:transparent;color:#A23B3B;border:1px solid #E3C8C8;padding:6px 12px;font-size:13px;}
button.danger:hover{background:#FBEEEE;}
button.link{background:none;color:var(--accent-deep);padding:4px 0;text-decoration:underline;font-size:12px;font-weight:500;}
.helper{font-size:12px;color:var(--ink-muted);margin-top:4px;}
.empty{text-align:center;color:var(--ink-muted);padding:30px 0;font-size:13px;}
.error-box{background:#FBEEEE;border:1px solid #E3C8C8;color:#8A2E2E;padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:14px;}
.steps{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap;}
.steps .step{font-size:11px;color:var(--ink-muted);padding:5px 10px;border:1px solid var(--line);border-radius:14px;font-weight:500;}
.steps .step.active{color:var(--accent-deep);border-color:var(--accent);background:#FBF6EC;}
.steps .step.done{color:var(--realizada);border-color:var(--realizada);}
.calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.calendar-header .label{font-weight:600;font-size:15px;text-transform:capitalize;}
.calendar-header button{background:none;border:1px solid var(--line);color:var(--accent-deep);padding:5px 10px;font-size:13px;}
.calendar-header button:disabled{opacity:.3;cursor:not-allowed;}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.calendar-grid .wd{font-size:11px;color:var(--ink-muted);text-align:center;padding-bottom:4px;text-transform:uppercase;font-weight:600;}
.calendar-grid .day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid transparent;}
.calendar-grid .day.empty{visibility:hidden;cursor:default;}
.calendar-grid .day.disabled{color:var(--ink-muted);opacity:.3;cursor:not-allowed;}
.calendar-grid .day.full{color:var(--ink-muted);opacity:.45;cursor:not-allowed;text-decoration:line-through;}
.calendar-grid .day.ok:hover{border-color:var(--accent);background:#FBF6EC;}
.calendar-grid .day.selected{background:var(--accent-deep);color:#fff;}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px;}
.slot-btn{padding:14px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;font-weight:600;font-size:14px;text-align:center;cursor:pointer;color:var(--ink);}
.slot-btn:hover{border-color:var(--accent);background:#FBF6EC;}
.slot-btn.taken{opacity:.35;cursor:not-allowed;text-decoration:line-through;background:#F4F4F4;}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
.summary-row:last-child{border-bottom:none;}
.summary-row .k{color:var(--ink-muted);font-size:12px;text-transform:uppercase;font-weight:500;}
.summary-row .v{font-weight:600;text-align:right;}
.tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--line);}
.tabs button{background:none;color:var(--ink-muted);border:none;border-bottom:2px solid transparent;border-radius:0;padding:10px 4px;margin-right:18px;font-size:13px;text-transform:uppercase;letter-spacing:.03em;}
.tabs button.active{color:var(--accent-deep);border-bottom-color:var(--accent);}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end;}
.filters .field{margin-bottom:0;min-width:160px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.03em;padding:8px;border-bottom:1px solid var(--line);font-weight:600;}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;}
tr:hover td{background:#F8F9FA;}
.count-bar{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;font-size:13px;color:var(--ink-muted);}
.count-bar strong{color:var(--ink);}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:6px;}
.table-wrap table{min-width:760px;}
.table-wrap th, .table-wrap td{white-space:nowrap;}
.table-wrap td[data-label="Contacto"]{white-space:normal;min-width:180px;}
@media (max-width:640px){
  header.topbar{padding:14px 16px;}
  main{padding:20px 12px 50px;}
  .row{flex-direction:column;}
}
</style>
</head>

function quitarAcentos(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim(); }

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = ''; rows.push(row); row = [];
      } else field += c;
    }
  }
  if(field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || r[0] !== '');
}

async function fetchGastosPendientes(unit_name){
  const vacio = {monto_ocupacion: 0, monto_contraentrega: 0, cuotas_pendientes: 0};
  if(!CSV_GASTOS_URL || CSV_GASTOS_URL.includes('PEGAR_AQUI')) return vacio;
  try{
    const sep = CSV_GASTOS_URL.includes('?') ? '&' : '?';
    const res = await fetch(CSV_GASTOS_URL + sep + 'cb=' + Date.now());
    const text = await res.text();
    const rows = parseCSV(text);
    if(rows.length < 2) return vacio;
    const headers = rows[0].map(quitarAcentos);
    const idxUnidad = headers.findIndex(h => h.includes('unidad'));
    const idxOcup = headers.findIndex(h => h.includes('ocupac'));
    const idxContra = headers.findIndex(h => h.includes('contraentreg'));
    const idxCuotas = headers.findIndex(h => h.includes('cuota'));
    if(idxUnidad < 0) return vacio;
    const match = rows.slice(1).find(r => quitarAcentos(r[idxUnidad]) === quitarAcentos(unit_name));
    if(!match) return vacio;
    const toNum = v => {
      // Formato uruguayo: "." separador de miles, "," separador decimal (ej. "4.038,40")
      let s = String(v || '0').trim().replace(/\./g, '').replace(',', '.');
      s = s.replace(/[^0-9.\-]/g, '');
      return parseFloat(s) || 0;
    };
    return {
      monto_ocupacion: idxOcup >= 0 ? toNum(match[idxOcup]) : 0,
      monto_contraentrega: idxContra >= 0 ? toNum(match[idxContra]) : 0,
      cuotas_pendientes: idxCuotas >= 0 ? toNum(match[idxCuotas]) : 0,
    };
  } catch(err){
    console.error('Error leyendo el CSV de gastos pendientes', err);
    return vacio;
  }
}

const TIME_SLOTS = ['09:00-10:00','10:00-11:00','11:00-12:00','13:00-14:00','14:00-15:00','15:00-16:00','16:00-17:00'];
function slotsForDate(dateStr){
  const day = new Date(dateStr+'T00:00:00').getDay();
  return day === 5 ? TIME_SLOTS.filter(s => s !== '16:00-17:00') : TIME_SLOTS; // viernes sin 16 a 17

function renderCalendar(){
  const year = state.calYear, month = state.calMonth;
  const first = new Date(year, month, 1);
  const offset = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const label = first.toLocaleDateString('es-UY', {month:'long', year:'numeric'});
  const isCurrentOrPast = (year < todayDate.getFullYear()) || (year===todayDate.getFullYear() && month<=todayDate.getMonth());

  let cells = '';
  for(let i=0;i<offset;i++) cells += `<div class="day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(year, month, d);
    const dateStr = isoDate(dateObj);
    const weekday = dateObj.getDay();
    const isWeekend = weekday===0 || weekday===6;
    const isPast = dateObj < todayDate;
    const MAX_PER_SLOT = 2;
    const takenCount = state.deliveries.filter(x => x.delivery_date===dateStr).length;
    const isFull = takenCount >= slotsForDate(dateStr).length * MAX_PER_SLOT;
    const isSelected = state.booking.date === dateStr;

    let cls = 'day';
    if(isPast || isWeekend) cls += ' disabled';
    else if(isFull) cls += ' full';
    else cls += ' ok';
    if(isSelected) cls += ' selected';

    const clickable = !isPast && !isWeekend && !isFull;
    cells += `<div class="${cls}" ${clickable ? `onclick="selectDate('${dateStr}')"` : ''}>${d}</div>`;
  }

  return `
  <div class="calendar-header">
    <button onclick="changeMonth(-1)" ${isCurrentOrPast ? 'disabled' : ''}>&larr;</button>
    <div class="label">${escHtml(label)}</div>
    <button onclick="changeMonth(1)">&rarr;</button>
  </div>
  <div class="calendar-grid">
    ${WD_LABELS.map(w=>`<div class="wd">${w}</div>`).join('')}
    ${cells}
  </div>`;
}

function changeMonth(delta){
  let m = state.calMonth + delta;
  let y = state.calYear;
  if(m<0){ m=11; y--; }
  if(m>11){ m=0; y++; }
  state.calMonth = m; state.calYear = y;
  render();
}

function continueToReview(){

  const unit_name = $('f_unit').value.trim();
  const cochera_name = $('f_cochera').value.trim();
  const nombre = $('f_nombre').value.trim();
  const apellido = $('f_apellido').value.trim();
  const email = $('f_email').value.trim();
  const telefono = $('f_telefono').value.trim();
  const inmobiliaria = $('f_inmobiliaria').value.trim();

  if(!unit_name || !validApts.has(unit_name)){
    state.bookingError = 'La unidad no existe o ya tiene una entrega agendada. Elegila de la lista.';
    render(); return;
  }
  if(cochera_name && !validCocheras.has(cochera_name)){
    state.bookingError = 'La cochera no existe o ya tiene una entrega agendada. Elegila de la lista o dejá el campo vacío.';
    render(); return;
  }
  if(!nombre || !apellido || !email || !telefono || !inmobiliaria){
    state.bookingError = 'Completá nombre, apellido, email, teléfono e inmobiliaria.';
    render(); return;
  }
  state.booking = {...state.booking, unit_name, cochera_name, nombre, apellido, email, telefono, inmobiliaria};
  state.bookingError = '';
  state.step = 4;
  render();
}

async function confirmBooking(){
  const b = state.booking;
  await loadData(); // recargamos datos frescos antes de validar
  const slotCount = state.deliveries.filter(d => d.delivery_date===b.date && d.time_range===b.slot).length;
  const stillFree = slotCount < 2;
  const unitFree = !state.deliveries.some(d => d.unit_name===b.unit_name);
  const cocheraFree = !b.cochera_name || !state.deliveries.some(d => d.unit_name===b.cochera_name);
  if(!stillFree || !unitFree || !cocheraFree){
    state.bookingError = !stillFree ? 'Ese horario ya no tiene cupo disponible. Elegí otro.' : 'Esa unidad o cochera ya tiene una entrega agendada.';
    state.step = !stillFree ? 2 : 3;
    render(); return;
  }
  const {error} = await sb.from('deliveries').insert({
    building: state.building, unit_name: b.unit_name, delivery_date: b.date, time_range: b.slot,
    nombre: b.nombre, apellido: b.apellido, email: b.email, telefono: b.telefono, inmobiliaria: b.inmobiliaria,
    status: 'agendada',
  });
  if(error){
    // 23505 = ya existe (alguien se anotó justo antes en el mismo turno o unidad)
    state.bookingError = 'Justo se ocupó ese horario o esa unidad. Elegí de nuevo.';
    await loadData();
    state.step = 2;
    render(); return;
  }
  sendConfirmationEmail(b);
  await loadData();
  state.step = 5;
  render();
}

async function sendConfirmationEmail(b){
  if(!EMAIL_WEBHOOK_URL || EMAIL_WEBHOOK_URL.includes('PEGAR_AQUI')) return;
  const fecha = new Date(b.date+'T00:00:00').toLocaleDateString('es-UY', {weekday:'long', day:'2-digit', month:'long'});
  const [start_time, end_time] = b.slot.split('-');
  const gastos = await fetchGastosPendientes(b.unit_name);
  const params = new URLSearchParams({
    nombre: b.nombre, apellido: b.apellido, email: b.email, telefono: b.telefono, inmobiliaria: b.inmobiliaria,
    unit_name: b.unit_name, delivery_date: b.date, start_time, end_time,
    fecha, horario: b.slot.replace('-',' a '),
    monto_ocupacion: gastos.monto_ocupacion,
    monto_contraentrega: gastos.monto_contraentrega,
    cuotas_pendientes: gastos.cuotas_pendientes,
  });
  fetch(EMAIL_WEBHOOK_URL, { method: 'POST', body: params }).catch(()=>{});
}

        <thead><tr><th>Identificador</th><th>Tipo</th><th></th></tr></thead>
        <tbody>
          ${state.units.map(u => `
            <tr>
              <td data-label="Identificador">${escHtml(u.unit_name)}</td>
              <td data-label="Tipo">${escHtml(u.tipo)}</td>
              <td><button class="danger" onclick="deleteUnit('${u.id}')">Eliminar</button></td>
            </tr>`).join('')}
        </tbody>
      </table></div>
    </div>`;
}

async function bulkAddUnits(){
  const raw = $('bulkUnits').value;
  const tipo = $('bulkTipo').value;
  const names = raw.split(/[\n,]/).map(s=>s.trim()).filter(Boolean);
  if(names.length===0){ alert('Ingresá al menos un identificador.'); return; }
  const rows = names.map(n => ({building: state.building, unit_name: n, tipo}));
  const {error} = await sb.from('delivery_units').upsert(rows, {onConflict:'building,unit_name', ignoreDuplicates:true});
  if(error){ alert('Error al guardar: ' + error.message); return; }
  await loadData();
  render();
}
async function deleteUnit(id){
  if(!confirm('¿Eliminar este registro?')) return;
  const {error} = await sb.from('delivery_units').delete().eq('id', id);
  if(error){ alert('Error al eliminar: ' + error.message); return; }
  await loadData();
  render();
}

function renderListadoTab(){
  const bookedMap = {};
  state.deliveries.forEach(d => { bookedMap[d.unit_name] = d; });

  const counts = {sinagendar:0, agendada:0, entregada:0};
  state.units.forEach(u => {
    const d = bookedMap[u.unit_name];
    if(!d) counts.sinagendar++;
    else counts[d.status]++;
  });

  const f = state.filters;
  const filtered = state.units.filter(u => {
    if(f.tipo !== 'todas' && u.tipo !== f.tipo) return false;
    if(f.search && !u.unit_name.toLowerCase().includes(f.search.toLowerCase())) return false;
    const d = bookedMap[u.unit_name];
    const estado = !d ? 'sinagendar' : d.status;
    if(f.estado !== 'todas' && estado !== f.estado) return false;
    return true;
  });

  return `
    <div class="row" style="margin-bottom:14px;">
      <div class="field" style="flex:none;"><button onclick="downloadXLSX()">Descargar planilla (Excel)</button></div>
    </div>
    <div class="count-bar">
      <div>Sin agendar: <strong>${counts.sinagendar}</strong></div>
      <div>Agendadas: <strong>${counts.agendada}</strong></div>
      <div>Entregadas: <strong>${counts.entregada}</strong></div>
      <div>Total: <strong>${state.units.length}</strong></div>
    </div>
    <div class="filters">
      <div class="field">
        <label>Buscar</label>
        <input id="filterSearch" placeholder="Número de unidad o cochera" value="${escHtml(f.search)}" oninput="updateFilter('search', this.value)">
      </div>
      <div class="field">
        <label>Tipo</label>
        <select onchange="updateFilter('tipo', this.value)">
          <option value="todas" ${f.tipo==='todas'?'selected':''}>Todas</option>
          <option value="Unidad" ${f.tipo==='Unidad'?'selected':''}>Unidades</option>
          <option value="Cochera" ${f.tipo==='Cochera'?'selected':''}>Cocheras</option>
        </select>
      </div>
      <div class="field">
        <label>Estado</label>
        <select onchange="updateFilter('estado', this.value)">
          <option value="todas" ${f.estado==='todas'?'selected':''}>Todos</option>
          <option value="sinagendar" ${f.estado==='sinagendar'?'selected':''}>Sin agendar</option>
          <option value="agendada" ${f.estado==='agendada'?'selected':''}>Agendada</option>
          <option value="entregada" ${f.estado==='entregada'?'selected':''}>Entregada</option>
        </select>
      </div>
    </div>
    <p class="helper" style="margin-bottom:10px;">Mostrando ${filtered.length} de ${state.units.length}.</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Unidad</th><th>Tipo</th><th>Estado</th><th>Fecha</th><th>Horario</th><th>Contacto</th><th>Inmobiliaria</th><th>Entregada</th><th></th></tr></thead>
      <tbody>
        ${filtered.length === 0 ? `<tr><td colspan="9"><p class="empty">No hay resultados con estos filtros.</p></td></tr>` : filtered.map(u => {
          const d = bookedMap[u.unit_name];
          const estado = !d ? 'sinagendar' : d.status;
          const estadoLabel = !d ? 'Sin agendar' : (d.status==='agendada' ? 'Agendada' : 'Entregada');
          return `
          <tr>
            <td data-label="Unidad">${escHtml(u.unit_name)}</td>
            <td data-label="Tipo">${escHtml(u.tipo)}</td>
            <td data-label="Estado"><span class="stamp ${estado}" style="font-size:10px;padding:2px 7px;">${estadoLabel}</span></td>
            <td data-label="Fecha">${d ? new Date(d.delivery_date+'T00:00:00').toLocaleDateString('es-UY',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—'}</td>
            <td data-label="Horario">${d ? d.time_range.replace('-',' a ') : '—'}</td>
            <td data-label="Contacto">${d ? escHtml(d.nombre+' '+d.apellido) + '<br><span class="helper">'+escHtml(d.email)+' · '+escHtml(d.telefono)+'</span>' : '—'}</td>
            <td data-label="Inmobiliaria">${d ? escHtml(d.inmobiliaria || '—') : '—'}</td>
            <td data-label="Entregada" style="text-align:center;">
              <input type="checkbox" ${!d ? 'disabled' : ''} ${d && d.status==='entregada' ? 'checked' : ''}
                onchange="${d ? `toggleEntregada('${d.id}', this.checked)` : ''}" style="width:18px;height:18px;cursor:${d?'pointer':'default'};">
            </td>
            <td data-label="">${d ? `<button class="danger" onclick="freeSlot('${d.id}')">Liberar turno</button>` : ''}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>`;
}

function updateFilter(key, value){
  state.filters[key] = value;
  render();
  if(key==='search'){ const el = $('filterSearch'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
}

async function toggleEntregada(id, checked){
  const {error} = await sb.from('deliveries').update({status: checked ? 'entregada' : 'agendada'}).eq('id', id);
  if(error){ alert('Error: ' + error.message); return; }
  await loadData();
  render();
}
async function freeSlot(id){
  if(!confirm('¿Liberar este turno? La unidad va a quedar sin agendar y se podrá reservar de nuevo.')) return;
  const {error} = await sb.from('deliveries').delete().eq('id', id);
  if(error){ alert('Error: ' + error.message); return; }
  await loadData();
  render();
}

function downloadXLSX(){
  const bookedMap = {};
  state.deliveries.forEach(d => { bookedMap[d.unit_name] = d; });
  const header = ['Unidad','Tipo','Estado','Fecha','Horario','Nombre','Apellido','Email','Teléfono','Inmobiliaria'];
  const rows = state.units.map(u => {
    const d = bookedMap[u.unit_name];
    const estado = !d ? 'Sin agendar' : (d.status==='agendada' ? 'Agendada' : 'Entregada');
    return [u.unit_name, u.tipo, estado, d?d.delivery_date:'', d?d.time_range:'', d?d.nombre:'', d?d.apellido:'', d?d.email:'', d?d.telefono:'', d?d.inmobiliaria:''];
  });
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  ws['!cols'] = [{wch:10},{wch:10},{wch:12},{wch:12},{wch:14},{wch:14},{wch:14},{wch:26},{wch:14},{wch:22}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Entregas');
  XLSX.writeFile(wb, 'entregas_garden.xlsx');
}

(async function init(){
  await loadData();
  render();
})();
</script>
</body>
</html>
